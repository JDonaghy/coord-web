name: CI

# Split out of claude-coordinator's test.yml/acceptance-web.yml (#2005, epic
# #2002 UX-3/UX-4). Two things this repo's CI deliberately does NOT do yet,
# both open cross-repo design questions tracked in claude-coordinator:
#
#   - `python scripts/codegen.py --check` (the generated.ts drift gate) --
#     it needs the Python backend's OpenAPI spec, which lives in
#     claude-coordinator, not here. See claude-coordinator#2258.
#   - The sealed oracle-loop acceptance suite (tests/acceptance/ms-51) --
#     where it lives post-split is an explicitly open question,
#     claude-coordinator#2007 (UX-5). Not duplicated here until that's
#     decided.
#
# Until those land, this is the gate: typecheck, unit tests, production
# build, and the Playwright e2e suite (including the one spec that boots a
# real `coord web --fixture` process -- installed from PyPI, the same public
# package `pip install code-coordinator` anyone gets).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # `live-update-fixture.spec.ts` boots a real `coord web --fixture`
      # process (see its own header) -- the CLI has to be on PATH. It's a
      # public PyPI package; no credentials needed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install code-coordinator
      # claude-coordinator#2393: uncached `npx playwright install
      # chromium --with-deps` hung 20-34min three times in one afternoon.
      # Cache the browser binary; only a cache miss (a version bump) pays
      # the network cost. Same shape as claude-coordinator's own e2e job.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright + OS deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            echo "Playwright install attempt $attempt/3..."
            if timeout 300 npx playwright install chromium --with-deps; then
              echo "Playwright install succeeded on attempt $attempt"
              exit 0
            fi
            echo "Playwright install attempt $attempt failed or timed out after 5m"
            sleep 10
          done
          echo "Playwright install failed after 3 attempts"
          exit 1
      - name: Install Playwright OS deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
